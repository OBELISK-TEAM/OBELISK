name: docker

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - "*"

jobs:
  docker-pipeline:
    runs-on: ubuntu-latest
    environment:
      name: ci-env
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set environment variables
        run: |
          echo "APP_ENV=${{ vars.APP_ENV }}" >> $GITHUB_ENV
          echo "CLIENT_HOST=${{ vars.CLIENT_HOST }}" >> $GITHUB_ENV
          echo "CLIENT_PORT=${{ vars.CLIENT_PORT }}" >> $GITHUB_ENV
          echo "CORS_ORIGIN=${{ vars.CORS_ORIGIN }}" >> $GITHUB_ENV
          echo "DB_HOST=${{ vars.DB_HOST }}" >> $GITHUB_ENV
          echo "DB_NAME=${{ vars.DB_NAME }}" >> $GITHUB_ENV
          echo "DB_PASSWORD=${{ vars.DB_PASSWORD }}" >> $GITHUB_ENV
          echo "DB_PORT=${{ vars.DB_PORT }}" >> $GITHUB_ENV
          echo "DB_USER=${{ vars.DB_USER }}" >> $GITHUB_ENV
          echo "DB_VOLUME_LOCATION=${{ vars.DB_VOLUME_LOCATION }}" >> $GITHUB_ENV
          echo "GOOGLE_CALLBACK_URL=${{ vars.GOOGLE_CALLBACK_URL }}" >> $GITHUB_ENV
          echo "GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}" >> $GITHUB_ENV
          echo "GOOGLE_CLIENT_SECRET=${{ vars.GOOGLE_CLIENT_SECRET }}" >> $GITHUB_ENV
          echo "JWT_EXPIRES_IN=${{ vars.JWT_EXPIRES_IN }}" >> $GITHUB_ENV
          echo "JWT_SECRET=${{ vars.JWT_SECRET }}" >> $GITHUB_ENV
          echo "MAILING_HOST=${{ vars.MAILING_HOST }}" >> $GITHUB_ENV
          echo "MAILING_PASS=${{ vars.MAILING_PASS }}" >> $GITHUB_ENV
          echo "MAILING_PORT=${{ vars.MAILING_PORT }}" >> $GITHUB_ENV
          echo "MAILING_SECURE=${{ vars.MAILING_SECURE }}" >> $GITHUB_ENV
          echo "MAILING_USER=${{ vars.MAILING_USER }}" >> $GITHUB_ENV
          echo "MAX_BOARD_SIZE_IN_BYTES=${{ vars.MAX_BOARD_SIZE_IN_BYTES }}" >> $GITHUB_ENV
          echo "NEXT_GW_SERVER_HOST=${{ vars.NEXT_GW_SERVER_HOST }}" >> $GITHUB_ENV
          echo "RABBITMQ_HOST=${{ vars.RABBITMQ_HOST }}" >> $GITHUB_ENV
          echo "RABBITMQ_MANAGEMENT_PORT=${{ vars.RABBITMQ_MANAGEMENT_PORT }}" >> $GITHUB_ENV
          echo "RABBITMQ_PASS=${{ vars.RABBITMQ_PASS }}" >> $GITHUB_ENV
          echo "RABBITMQ_PORT=${{ vars.RABBITMQ_PORT }}" >> $GITHUB_ENV
          echo "RABBITMQ_QUEUE=${{ vars.RABBITMQ_QUEUE }}" >> $GITHUB_ENV
          echo "RABBITMQ_USER=${{ vars.RABBITMQ_USER}}" >> $GITHUB_ENV
          echo "SERVER_HOST=${{ vars.SERVER_HOST }}" >> $GITHUB_ENV
          echo "SERVER_PORT=${{ vars.SERVER_PORT }}" >> $GITHUB_ENV
          echo "SLIDE_LIMIT_PER_BOARD=${{ vars.SLIDE_LIMIT_PER_BOARD }}" >> $GITHUB_ENV
          echo "SOCKET_GW_PORT=${{ vars.SOCKET_GW_PORT }}" >> $GITHUB_ENV

      - name: Build docker images
        run: docker compose build

      - name: Start docker compose in detached mode
        run: docker compose up -d

      - name: Wait for services to start
        run: sleep 30

      - name: Run health check on server
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://${{ vars.SERVER_HOST }}:${{ vars.SERVER_PORT }}/health)
          if [ "$STATUS" -ne 200 ]; then
            echo "Health check failed with status code $STATUS"
            exit 1
          fi

      - name: Run health check on client
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://${{ vars.CLIENT_HOST }}:${{ vars.CLIENT_PORT }}/api/health)
          if [ "$STATUS" -ne 200 ]; then
            echo "Health check failed with status code $STATUS"
            exit 1
          fi

      - name: Stop docker containers
        run: docker compose down --volumes
