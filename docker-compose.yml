services:
  client:
    build:
      context: ./client
      args:
        - APP_ENV
        - SERVER_HOST=server
        - SERVER_PORT
        - SOCKET_GW_PORT
        - GOOGLE_CLIENT_ID
        - GOOGLE_CLIENT_SECRET
        - GOOGLE_CALLBACK_URL
        - NEXT_GW_SERVER_HOST
    ports:
      - "${CLIENT_PORT}:${CLIENT_PORT}"
    container_name: obelisk_client_container
    environment:
      - CLIENT_HOST
      - CLIENT_PORT

  server:
    build: ./server
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
      - "${SOCKET_GW_PORT}:${SOCKET_GW_PORT}"
    container_name: obelisk_server_container
    depends_on:
      - mongo
      - rabbitmq
    environment:
      - SERVER_HOST
      - SERVER_PORT
      - RABBITMQ_HOST
      - RABBITMQ_PORT
      - RABBITMQ_QUEUE
      - SOCKET_GW_PORT
      - DB_NAME
      - DB_USER
      - DB_PASSWORD
      - DB_HOST=mongo
      - DB_PORT
      - JWT_SECRET
      - JWT_EXPIRES_IN
      - GOOGLE_CLIENT_ID
      - GOOGLE_CLIENT_SECRET
      - GOOGLE_CALLBACK_URL
      - MAILING_HOST
      - MAILING_PORT
      - MAILING_SECURE
      - MAILING_USER
      - MAILING_PASS

  rabbitmq:
    image: rabbitmq:3.12.2-management
    ports:
      - "${RABBITMQ_PORT}:${RABBITMQ_PORT}"
      - "${RABBITMQ_MANAGEMENT_PORT}:${RABBITMQ_MANAGEMENT_PORT}"
    container_name: obelisk_rabbitmq_container
    environment:
      - RABBITMQ_USER
      - RABBITMQ_PASSWORD

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    container_name: obelisk_mongodb_container
    environment:
      - MONGO_INITDB_DATABASE=${DB_NAME}
      - MONGO_INITDB_ROOT_USERNAME=${DB_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${DB_PASSWORD}
    volumes:
      - ${DB_VOLUME_LOCATION}

volumes:
  mongo_data:
    driver: local

